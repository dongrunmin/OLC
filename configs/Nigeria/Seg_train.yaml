MODEL:
  architecture:  "STMamba"
  shape_pattern: "NTHWC"
  img_res: 256
  max_seq_len: 8
  num_channels: 4 
  num_classes: 2
  dropout: 0.

DATASETS:
  train:
    dataset: "Nigeria"
    label_map:
    max_seq_len: 8
    batch_size: 4
    extra_data:
    num_workers: 1

  eval:
    dataset: "Nigeria"
    label_map:
    max_seq_len: 8
    batch_size: 4
    extra_data:
    num_workers: 1

SOLVER:
  num_epochs: 120
  num_warmup_epochs: 10
  steps: (0, 80000)
  loss_function:  TemporalCrossEntropyLoss
  class_weights: {'0': 1, '1': 5}
  ignore: 255
  temporal_weight: 0.1
  lr_scheduler: 'cosine'
  lr_base: 1e-4
  lr_min: 5e-6
  lr_start: 1e-8
  num_cycles: 1
  reset_lr: True   # resets lr to base value when loading pretrained model
  weight_decay: 0.01

CHECKPOINT:
  pretrain:
  load_from_checkpoint:
  partial_restore: False
  save_path: 'exp/saved_models/Nigeria_seg/'
  train_metrics_steps: 8
  eval_steps: 16
  save_steps: 32
